version: 2

sources:
  - name: bronze_account_mapping
    description: Cross-subsidiary account-mapping bronze.
    schema: bronze_account_mapping
    tables:
      - name: account_mapping_import
        description: GL account → COA-node mapping per (system, account).
      - name: coa_node_import
        description: COA node hierarchy (sourced from a managed-document service).
      - name: ico_definitions_import
        description: Intercompany relationship definitions.

  - name: bronze_customer_mapping
    description: Cross-subsidiary customer-mapping bronze.
    schema: bronze_customer_mapping
    tables:
      - name: country_dictionary_import
        description: source_country → use_country/region normalization.
      - name: customer_mapping_import
        description: Per-system unmapped customers, awaiting mapping.

  - name: bronze_sku_mapping
    description: Cross-subsidiary SKU-mapping bronze.
    schema: bronze_sku_mapping
    tables:
      - name: skus_add_import
        description: Proposed additions to the global SKU master.

# FX rates are not a bronze source in this demo — they ship as the
# `exchange_rates` seed and are staged by `stg__exchange_rates`
# (public Open Exchange Rates data; see dbt/seeds/exchange_rates.csv).
