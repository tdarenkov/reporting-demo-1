name: 'reporting_demo'
version: '1.0.0'
config-version: 2

profile: 'reporting_demo'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

clean-targets:
  - "target"
  - "dbt_packages"

# Per-folder defaults. Override per-model with {{ config(...) }}.
#
# Resulting schemas in Postgres are formed by `<profile_schema>_<+schema>`
# (or just `<profile_schema>` when no per-model `+schema` is set). Profile
# schema is "silver_dbt" — see profiles.yml — so this lands at:
#
#   staging       → silver_dbt_staging   (views)
#   intermediate  → no DB object         (ephemeral, inlined as CTEs)
#   marts         → silver_dbt           (tables)
#
models:
  reporting_demo:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table

# The exchange-rate reference table ships as a seed (public FX data, unlike the
# redacted live subsidiary sources). It lands beside the staging layer and is
# typed explicitly so `date`/`rate_to_usd` don't import as text.
seeds:
  reporting_demo:
    exchange_rates:
      +schema: staging
      +column_types:
        date: date
        currency: text
        rate_to_usd: numeric(18, 8)
